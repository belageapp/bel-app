const L=document.getElementById('log');
const log=m=>{L.textContent+=m+'\n';L.scrollTop=L.scrollHeight;};

window.run=async function(){
  const btn=document.getElementById('btn');
  btn.disabled=true;
  L.textContent='';
  log('🔄 登録開始...');
  let ok=0,ng=0;

  for(const[key,monthData]of Object.entries(DATA)){
    const[year,month]=key.split('_').map(Number);
    const monthStr=`${year}-${String(month).padStart(2,'0')}`;
    log(`\n📅 ${year}年${month}月 (${Object.keys(monthData).length}事業所)`);

    for(const[office,d]of Object.entries(monthData)){
      try{
        // 1. actuals の wd（稼働日数）を更新
        const monthRef=doc(db,'actuals',`${year}_${office}`,'months',String(month));
        await setDoc(monthRef,{wd:d.openDays},{merge:true});

        // 2. dailyActuals に日別集計を登録
        await setDoc(doc(db,'dailyActuals',`${year}_${month}_${office}`),{
          year,month,office,
          openDays:d.openDays,
          totalPeople:d.totalPeople,
          daily:d.daily,
          updatedAt:new Date().toISOString(),
        });

        // 3. reports に日別速報を登録（既存データを削除してから追加）
        const existing=await getDocs(query(
          collection(db,'reports'),
          where('month','==',monthStr),
          where('office','==',office),
          where('source','==','excel')
        ));
        for(const doc2 of existing.docs) await deleteDoc(doc2.ref);

        for(const[dateStr,kids]of Object.entries(d.daily)){
          if(kids<=0) continue;
          await addDoc(collection(db,'reports'),{
            office,date:dateStr,month:monthStr,
            kids,serviceType:null,
            source:'excel',
            time:dateStr+'T00:00:00',
            comment:'',
          });
        }

        log(`  ✅ ${office}: 稼働${d.openDays}日 / ${d.totalPeople}人 / ${Object.keys(d.daily).length}日分`);
        ok++;
      }catch(e){
        log(`  ❌ ${office}: ${e.message}`);
        ng++;
      }
    }
  }

  log(`\n🎉 完了: ${ok}件成功 / ${ng}件失敗`);
  if(ng===0) log('このファイルをGitHubから削除してください');
};
