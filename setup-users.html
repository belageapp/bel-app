<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ユーザー一括登録</title>
<style>
body{font-family:-apple-system,sans-serif;background:#F4F6F8;padding:24px}
.card{background:#fff;border-radius:12px;border:1px solid #E8EAED;padding:24px;max-width:560px;margin:0 auto}
h2{font-size:18px;font-weight:700;margin-bottom:8px}
p{font-size:13px;color:#666;margin-bottom:16px;line-height:1.6}
.warn{background:#FFF8E1;border:1px solid #FFD54F;border-radius:8px;padding:12px;font-size:12px;color:#5D4037;margin-bottom:16px}
button{width:100%;padding:12px;background:#F0FAF6;color:#1D9E75;border:1px solid #A8D5BE;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
button:disabled{background:#f5f5f5;color:#aaa;border-color:#E8EAED;cursor:not-allowed}
#log{margin-top:16px;padding:12px;background:#f5f5f5;border-radius:8px;font-size:12px;font-family:monospace;white-space:pre-wrap;max-height:500px;overflow-y:auto}
</style>
</head>
<body>
<div class="card">
  <h2>👥 ユーザー一括登録</h2>
  <p>15アカウントをFirebase Authentication＋Firestoreに登録します。</p>
  <div class="warn">⚠️ このツールはadminアカウントでログイン済みの状態で実行してください。登録後はこのファイルを削除してください。</div>
  <button id="btn" onclick="run()">登録開始</button>
  <div id="log">ボタンを押すと開始します</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const cfg = {
  apiKey:"AIzaSyCl48Fay9AbMLRXJ7npya4PJIgDQPvltxs",
  authDomain:"daily-report-b90e8.firebaseapp.com",
  projectId:"daily-report-b90e8",
  storageBucket:"daily-report-b90e8.firebasestorage.app",
  messagingSenderId:"16569831525",
  appId:"1:16569831525:web:aa250f2061f762dfe1768c"
};
const app  = initializeApp(cfg);
const auth = getAuth(app);
const db   = getFirestore(app);

const USERS = [
  { email:'hugkumi@belage.co.jp',            password:'belage2026', displayName:'HUGくみのいえ',    role:'manager',      officeId:'HUGくみのいえ' },
  { email:'readygo-inokuchi@belage.co.jp',   password:'belage2026', displayName:'ReadyGO井口',       role:'manager',      officeId:'ReadyGO井口' },
  { email:'readygo-yagi@belage.co.jp',       password:'belage2026', displayName:'ReadyGO八木',       role:'manager',      officeId:'ReadyGO八木' },
  { email:'readygo-kawauchi@belage.co.jp',   password:'belage2026', displayName:'ReadyGO川内',       role:'manager',      officeId:'ReadyGO川内' },
  { email:'cocoiro@belage.co.jp',            password:'belage2026', displayName:'ここいろのいえ',    role:'manager',      officeId:'ここいろのいえ' },
  { email:'niji@belage.co.jp',               password:'belage2026', displayName:'にじのいえ',        role:'manager',      officeId:'にじのいえ' },
  { email:'hare@belage.co.jp',               password:'belage2026', displayName:'はれのいえ',        role:'manager',      officeId:'はれのいえ' },
  { email:'manabiai@belage.co.jp',           password:'belage2026', displayName:'まなびあいのいえ', role:'manager',      officeId:'まなびあいのいえ' },
  { email:'readygo-takaya@belage.co.jp',     password:'belage2026', displayName:'ReadyGO高屋',       role:'manager',      officeId:'ReadyGO高屋' },
  { email:'readygo-kurose@belage.co.jp',     password:'belage2026', displayName:'ReadyGO黒瀬',       role:'manager',      officeId:'ReadyGO黒瀬' },
  { email:'grazie-kurose@belage.co.jp',      password:'belage2026', displayName:'ぐらっちぇ黒瀬',   role:'manager',      officeId:'ぐらっちぇ黒瀬' },
  { email:'laforet-kouyou@belage.co.jp',     password:'belage2026', displayName:'ラフォーレ高陽',   role:'manager',      officeId:'ラフォーレ高陽' },
  { email:'laforet-kameyama@belage.co.jp',   password:'belage2026', displayName:'ラフォーレ亀山',   role:'manager',      officeId:'ラフォーレ亀山' },
  { email:'repos-shiraki@belage.co.jp',      password:'belage2026', displayName:'レポ白木',          role:'manager',      officeId:'レポ白木' },
  { email:'kanemoto@belage.co.jp',           password:'kanemoto2026', displayName:'金本 紋奈',          role:'area_manager',  officeId:null },
];

const L = document.getElementById('log');
const log = m => { L.textContent += m + '\n'; L.scrollTop = L.scrollHeight; };

// 現在のadminユーザーを保存
let adminUser = null;
let adminEmail = null;
let adminPassword = null;

window.run = async function() {
  document.getElementById('btn').disabled = true;
  L.textContent = '';

  // adminのメールとパスワードを入力してもらう
  adminEmail    = prompt('adminのメールアドレスを入力してください');
  adminPassword = prompt('adminのパスワードを入力してください');
  if (!adminEmail || !adminPassword) {
    log('❌ キャンセルしました');
    document.getElementById('btn').disabled = false;
    return;
  }

  log('🔄 登録開始...\n');
  let ok = 0, ng = 0;

  for (const u of USERS) {
    try {
      // 新規ユーザーを作成
      const cred = await createUserWithEmailAndPassword(auth, u.email, u.password);
      const uid  = cred.user.uid;

      // Firestoreにusersデータを登録
      await setDoc(doc(db, 'users', uid), {
        uid,
        email:       u.email,
        displayName: u.displayName,
        role:        u.role,
        disabled:    false,
        officeId:    u.officeId,
        areaId:      null,
        loginId:     u.email.split('@')[0],
        createdAt:   new Date().toISOString(),
      });

      log(`✅ ${u.displayName}（${u.email}）`);
      ok++;

      // adminに戻る
      await signInWithEmailAndPassword(auth, adminEmail, adminPassword);

    } catch(e) {
      if (e.code === 'auth/email-already-in-use') {
        log(`⚠️  ${u.displayName}（${u.email}）すでに登録済み`);
      } else {
        log(`❌ ${u.displayName}（${u.email}）: ${e.message}`);
        ng++;
      }
      // エラーでもadminに戻る
      try { await signInWithEmailAndPassword(auth, adminEmail, adminPassword); } catch(e2) {}
    }
  }

  log(`\n🎉 完了: ${ok}件登録 / ${ng}件失敗`);
  log('このファイルをGitHubから削除してください');
  log(`\nadminに再ログインしています...`);
  try {
    await signInWithEmailAndPassword(auth, adminEmail, adminPassword);
    log('✅ adminログイン完了');
  } catch(e) {
    log('⚠️ adminの再ログインに失敗しました。手動でログインしてください。');
  }
};
</script>
</body>
</html>
