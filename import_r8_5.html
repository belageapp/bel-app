let logEl, statusEl;

function log(msg, color='#7fff7f') {
  if (!logEl) return;
  logEl.style.display = 'block';
  logEl.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

onAuthStateChanged(auth, user => {
  statusEl = document.getElementById('status');
  if (!user) {
    statusEl.style.display = 'block';
    statusEl.style.color = '#C0392B';
    statusEl.textContent = '⚠️ ログインが必要です。先にdaily.htmlにログインしてから開いてください。';
    document.getElementById('btn-start').disabled = true;
  } else {
    statusEl.style.display = 'block';
    statusEl.style.color = '#0F6E56';
    statusEl.textContent = `✅ ログイン済み: ${user.email}`;
  }
});

window.startImport = async function() {
  const btn = document.getElementById('btn-start');
  btn.disabled = true;
  btn.textContent = '取込中...';
  logEl = document.getElementById('log');
  logEl.style.display = 'block';
  logEl.textContent = '';

  log('=== 既存データ確認中... ===', '#ffffff');

  // 2026-05 の既存レポートを全件取得
  const q = query(collection(db, 'reports'), where('month', '==', '2026-05'));
  const snap = await getDocs(q);
  const existing = new Set();
  snap.forEach(d => {
    const r = d.data();
    existing.add(`${r.office}__${r.date}`);
  });
  log(`既存: ${existing.size}件`, '#aaffff');

  let added = 0, skipped = 0, errors = 0;

  for (const rec of IMPORT_DATA) {
    const key = `${rec.office}__${rec.date}`;
    if (existing.has(key)) {
      skipped++;
      continue;
    }

    try {
      let data;
      if (rec.type === 'lafore') {
        data = {
          office: rec.office,
          date: rec.date,
          month: rec.month,
          kids: rec.care_actual + rec.work_actual,
          services: {
            "生活介護": { actual: rec.care_actual, reservations: 0, inquiries: 0, visits: 0, contracts: 0 },
            "就労B型":  { actual: rec.work_actual,  reservations: 0, inquiries: 0, visits: 0, contracts: 0 }
          },
          comment: '',
          time: '00:00',
          source: 'excel_import'
        };
      } else {
        data = {
          office: rec.office,
          date: rec.date,
          month: rec.month,
          kids: rec.actual,
          planned: rec.planned || 0,
          inquiry: 0,
          visit: 0,
          contract: 0,
          comment: '',
          time: '00:00',
          source: 'excel_import'
        };
      }
      await addDoc(collection(db, 'reports'), data);
      added++;
      log(`✓ ${rec.office} ${rec.date} (実績:${rec.type==='lafore'?rec.care_actual+'+'+rec.work_actual:rec.actual}, 予定:${rec.type==='lafore'?'—':rec.planned})`, '#7fff7f');
    } catch(e) {
      errors++;
      log(`✗ ${rec.office} ${rec.date}: ${e.message}`, '#ff7f7f');
    }

    // レート制限対策: 10件ごとに少し待つ
    if ((added + errors) % 10 === 0) await new Promise(r => setTimeout(r, 300));
  }

  log(`\n=== 完了 ===`, '#ffffff');
  log(`追加: ${added}件 / スキップ: ${skipped}件 / エラー: ${errors}件`, '#ffffaa');
  btn.textContent = `完了 (追加${added}件)`;
  btn.style.background = '#185FA5';
};
