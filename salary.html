<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給与データ取込 | ベルアージュ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { can, resolveTier } from './perm.js';
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  const firebaseConfig = {
  apiKey:"AIzaSyCl48Fay9AbMLRXJ7npya4PJIgDQPvltxs",
  authDomain:"daily-report-b90e8.firebaseapp.com",
  projectId:"daily-report-b90e8",
  storageBucket:"daily-report-b90e8.firebasestorage.app",
  messagingSenderId:"16569831525",
  appId:"1:16569831525:web:aa250f2061f762dfe1768c"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const DEPT_MAP = {
    '101': 'にじのいえ', '102': 'HUGくみのいえ', '103': 'はれのいえ',
    '104': 'ReadyGO井口', '105': 'ここいろのいえ', '106': 'ReadyGO八木',
    '107': 'ReadyGO川内', '201': 'まなびあいのいえ', '204': 'ReadyGO黒瀬',
    '205': 'ReadyGO高屋', '301': 'ラフォーレ高陽', '302': 'ラフォーレ亀山',
    '401': 'ぐらっちぇ黒瀬', '501': 'レポ白木', '900': '本社',
  };

  let currentUser = null;
  let currentRole = null;
  let currentUserData = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { location.href = 'login.html'; return; }
    currentUser = user;
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists() || snap.data().disabled) { await signOut(auth); location.href = 'login.html'; return; }
    currentUserData = snap.data();
    currentRole = currentUserData.role;
    const el = document.getElementById('top-bar-user-info');
    if (el) el.innerHTML = `<span style="font-size:11px;color:#555">${currentUserData.displayName||user.email}</span>`;
    if (!can(currentUserData, 'salary.view')) {
      document.getElementById('no-permission').style.display = 'flex';
    }
  });

  window._logout = async function() { await signOut(auth); location.href = 'login.html'; };

  // PDF解析（ページ単位でY座標グループ化）
  async function parsePDFAccurate(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const results = {};
    let yearMonth = null;
    let type = 'seishain';

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const content = await page.getTextContent();
      const items = content.items;

      // Y座標でグループ化
      const lineMap = {};
      for (const item of items) {
        const y = Math.round(item.transform[5]);
        if (!lineMap[y]) lineMap[y] = [];
        lineMap[y].push({ text: item.str, x: item.transform[4] });
      }
      const textLines = Object.keys(lineMap).map(Number).sort((a,b) => b-a)
        .map(y => lineMap[y].sort((a,b) => a.x-b.x).map(i => i.text).join(' '));
      const fullText = textLines.join('\n');

      // 年月（初回のみ）
      if (!yearMonth) {
        const m = fullText.match(/令和\s*(\d+)年\s*(\d+)月分/);
        if (m) {
          yearMonth = `${2018 + parseInt(m[1])}${String(parseInt(m[2])).padStart(2,'0')}`;
        }
      }

      // 体系判定（パート）
      if (fullText.includes('パートタイマー')) type = 'part';

      // 個別ページはスキップ、集計ページのみ処理
      if (!fullText.includes('*部課合計*')) continue;
      

      // 集計ページから部課コードと支給合計を抽出
      // 構造：「部　課」行（1行目）＋続く部課行（2行目）→ 支給項目行（人数）→ 支給合計次行（金額）
      // 部課コードは「部　課」行の後、次の「支給項目」行が来るまで複数行にわたって並ぶ
      let deptCodes = [];
      let headcounts = [];
      let inSikyuGokei = false;
      let collectingDepts = false;

      for (let li = 0; li < textLines.length; li++) {
        const line = textLines[li];

        // 「部　課」行：部課コード収集開始
        if (line.includes('部') && line.includes('課') && /\d{3}/.test(line)) {
          deptCodes = [...line.matchAll(/(\d{3})\s/g)].map(m => m[1]).filter(dc => DEPT_MAP[dc]);
          collectingDepts = true;
          continue;
        }

        // 部課コード続き行（数字3桁で始まる行）
        if (collectingDepts && /^\s+\d{3}\s/.test(line)) {
          const more = [...line.matchAll(/(\d{3})\s/g)].map(m => m[1]).filter(dc => DEPT_MAP[dc]);
          deptCodes = [...deptCodes, ...more];
          continue;
        }

        // 支給項目（人数）行で部課コード収集終了
        if (line.includes('支給項目') && line.includes('支給あり')) {
          collectingDepts = false;
          headcounts = [...line.matchAll(/支給あり(\d+)人/g)].map(m => parseInt(m[1]));
          continue;
        }

        // 支給合計の次行に金額
        if (line.trim() === '支給合計') { inSikyuGokei = true; continue; }
        if (inSikyuGokei) {
          inSikyuGokei = false;
          collectingDepts = false;
          const nums = [...line.matchAll(/(\d{1,3}(?:,\d{3})+)/g)].map(m => parseInt(m[1].replace(/,/g,'')));
          // 部課コードを昇順にソートして金額と対応
          const sortedCodes = [...deptCodes].sort((a,b) => a.localeCompare(b));
          sortedCodes.forEach((dc, idx) => {
            if (!results[dc] && nums[idx] && headcounts[idx] > 0) {
              const hcIdx = deptCodes.indexOf(dc);
              results[dc] = { totalPay: nums[idx], headcount: headcounts[hcIdx >= 0 ? hcIdx : idx], officeName: DEPT_MAP[dc] };
            }
          });
          deptCodes = [];
          headcounts = [];
        }
      }
    }

    return {
      yearMonth,
      type,
      entries: Object.entries(results).map(([dc, d]) => ({ deptCode: dc, ...d }))
    };
  }

  // ===================== UI =====================
  let parsedFiles = [];

  document.addEventListener('DOMContentLoaded', () => {
    const fi = document.getElementById('file-input');
    const dz = document.getElementById('drop-zone');
    fi.addEventListener('change', () => handleFiles(fi.files));
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); handleFiles(e.dataTransfer.files); });
  });

  async function handleFiles(files) {
    if (!files || files.length === 0) return;
    if (!['admin','supporter'].includes(resolveTier(currentUserData).tier)) { alert('権限がありません'); return; }
    parsedFiles = [];
    const prog = document.getElementById('parse-progress');
    const bar = document.getElementById('progress-bar');
    const wrap = document.getElementById('progress-wrap');
    prog.style.display = 'block'; wrap.style.display = 'block';
    const errors = [];
    for (let i = 0; i < files.length; i++) {
      prog.textContent = `解析中 (${i+1}/${files.length}): ${files[i].name}`;
      bar.style.width = `${Math.round((i/files.length)*100)}%`;
      try {
        const r = await parsePDFAccurate(files[i]);
        if (!r.yearMonth) { errors.push(`${files[i].name}: 年月を取得できませんでした`); continue; }
        if (r.entries.length === 0) { errors.push(`${files[i].name}: データが見つかりませんでした`); continue; }
        parsedFiles.push(r);
      } catch(e) { errors.push(`${files[i].name}: エラー (${e.message})`); }
    }
    bar.style.width = '100%';
    prog.textContent = '解析完了';
    if (parsedFiles.length === 0) { prog.textContent = 'エラー: ' + errors.join(' / '); return; }
    renderPreview(parsedFiles, errors);
    setStep(2);
  }

  function renderPreview(results, errors) {
    const byYM = {};
    for (const r of results) {
      if (!byYM[r.yearMonth]) byYM[r.yearMonth] = { seishain: [], part: [] };
      byYM[r.yearMonth][r.type].push(...r.entries);
    }

    let html = errors?.length ? `<div class="warn-box">⚠️ ${errors.join('<br>')}</div>` : '';

    for (const [ym, data] of Object.entries(byYM)) {
      const y = ym.slice(0,4), m = parseInt(ym.slice(4));
      html += `<div class="ym-header">📅 ${y}年${m}月分</div>`;

      const dm = {};
      for (const e of data.seishain) {
        if (!dm[e.deptCode]) dm[e.deptCode] = { officeName: e.officeName };
        dm[e.deptCode].seishain = e;
      }
      for (const e of data.part) {
        if (!dm[e.deptCode]) dm[e.deptCode] = { officeName: e.officeName };
        dm[e.deptCode].part = e;
      }

      html += `<table><thead><tr>
        <th>部課</th><th style="text-align:left">事業所名</th>
        <th>正社員 総支給</th><th>人数</th>
        <th>パート 総支給</th><th>人数</th>
        <th>合計 総支給</th>
      </tr></thead><tbody>`;

      for (const [dc, d] of Object.entries(dm).sort((a,b)=>a[0].localeCompare(b[0]))) {
        const sp = d.seishain?.totalPay || 0, sh = d.seishain?.headcount || 0;
        const pp = d.part?.totalPay || 0, ph = d.part?.headcount || 0;
        html += `<tr>
          <td class="td-code">${dc}</td>
          <td class="td-label">${d.officeName}</td>
          <td>${sp ? sp.toLocaleString() : '－'}</td>
          <td style="text-align:center;color:#888">${sh || '－'}</td>
          <td>${pp ? pp.toLocaleString() : '－'}</td>
          <td style="text-align:center;color:#888">${ph || '－'}</td>
          <td class="td-total">${(sp+pp).toLocaleString()}</td>
        </tr>`;
      }
      html += '</tbody></table>';
    }

    document.getElementById('preview-content').innerHTML = html;
    window._saveData = byYM;
  }

  window.doSave = async function() {
    const byYM = window._saveData;
    if (!byYM) return;
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = '保存中...';
    try {
      let count = 0;
      for (const [ym, data] of Object.entries(byYM)) {
        const dm = {};
        for (const e of data.seishain) { if (!dm[e.deptCode]) dm[e.deptCode] = { officeName: e.officeName }; dm[e.deptCode].seishain = { totalPay: e.totalPay, headcount: e.headcount }; }
        for (const e of data.part)     { if (!dm[e.deptCode]) dm[e.deptCode] = { officeName: e.officeName }; dm[e.deptCode].part     = { totalPay: e.totalPay, headcount: e.headcount }; }
        for (const [dc, d] of Object.entries(dm)) {
          const sp = d.seishain?.totalPay || 0, pp = d.part?.totalPay || 0;
          await setDoc(doc(db, 'salaries', `${ym}_${dc}`), {
            yearMonth: ym, deptCode: dc, officeName: d.officeName,
            seishain: d.seishain || null, part: d.part || null,
            totalPay: sp + pp,
            updatedAt: serverTimestamp(), updatedBy: currentUser.uid,
          }, { merge: true });
          count++;
        }
      }
      const ymLabels = Object.keys(byYM).map(ym => `${ym.slice(0,4)}年${parseInt(ym.slice(4))}月分`);
      document.getElementById('save-complete-sub').textContent = `${ymLabels.join('・')}：${count}件の事業所データを保存しました`;
      setStep(3);
    } catch(e) {
      alert('保存エラー: ' + e.message);
      btn.disabled = false; btn.textContent = '💾 保存する';
    }
  };

  window.reset = function() {
    parsedFiles = []; window._saveData = null;
    document.getElementById('file-input').value = '';
    document.getElementById('parse-progress').style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'none';
    document.getElementById('progress-bar').style.width = '0';
    setStep(1);
  };

  function setStep(n) {
    ['pane-step1','pane-step2','pane-step3'].forEach((id,i) => {
      document.getElementById(id).style.display = i+1===n ? 'block' : 'none';
    });
    ['step1','step2','step3'].forEach((id,i) => {
      const el = document.getElementById(id);
      el.className = 'step' + (i+1===n ? ' active' : i+1<n ? ' done' : '');
    });
  }
</script>

<body>

<div id="no-permission">
  <div class="no-perm-box">
    <div style="font-size:40px;margin-bottom:12px">🔒</div>
    <div style="font-weight:700;margin-bottom:8px">アクセス権限がありません</div>
    <div style="font-size:13px;color:#888">この画面はadmin・supportのみ利用できます</div>
    <br><a href="index.html" style="color:#1D9E75;font-weight:600">ポータルに戻る</a>
  </div>
</div>

<div class="top-bar">
  <div class="top-bar-logo">
    <img src="assets/belage_logo.png" alt="ベルアージュ" onerror="this.style.display='none'">
  </div>
  <div class="top-bar-main">
    <span class="top-bar-title">給与取込</span>
    <div class="top-bar-divider"></div>
    <a href="daily.html" class="nav-link">速報入力</a>
    <a href="monthly.html" class="nav-link">貢献速報（月次）</a>
    <a href="report.html" class="nav-link">貢献実績表</a>
    <a href="invoice.html" class="nav-link">報酬内容明細</a>
    <a href="import.html" class="nav-link">CSV取込</a>
    <a href="salary.html" class="nav-link active">給与取込</a>
    <a href="settings.html" class="nav-link">設定</a>
    <a href="index.html" class="nav-link">ポータル</a>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0;margin-left:4px" id="top-bar-user-info"></div>
    <button onclick="_logout()" style="padding:4px 10px;border-radius:6px;border:1px solid #E8EAED;background:#fff;color:#888;font-size:11px;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;margin-left:4px">ログアウト</button>
  </div>
</div>

<div class="content">
  <div class="steps">
    <div class="step active" id="step1"><span class="step-num">1</span>ファイル選択</div>
    <div class="step" id="step2"><span class="step-num">2</span>内容確認</div>
    <div class="step" id="step3"><span class="step-num">3</span>保存完了</div>
  </div>

  <!-- STEP1 -->
  <div id="pane-step1">
    <div class="card">
      <div class="card-title">賃金台帳PDFを選択</div>
      <div class="notice" style="margin-bottom:16px">
        <strong>⚠️ 対応ファイルについて</strong><br>
        TKC PX4で出力した賃金台帳PDF（支給控除一覧表）のみ対応しています。<br>
        正社員用・パートタイマー用を<strong>同時に選択</strong>するとまとめて処理できます。
      </div>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="drop-zone-icon">📂</div>
        <div class="drop-zone-text">クリックまたはドラッグ＆ドロップでPDFを選択</div>
        <div class="drop-zone-sub">正社員・パート 両方のPDFを同時に選択できます</div>
      </div>
      <input type="file" id="file-input" accept=".pdf" class="hidden" multiple>
      <div id="file-name" style="margin-top:8px;font-size:12px;color:#888"></div>
      <div id="parse-progress" class="progress" style="display:none"></div>
      <div class="progress-bar-wrap" id="progress-wrap" style="display:none">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- STEP2 -->
  <div id="pane-step2" style="display:none">
    <div class="card">
      <div class="card-title">取込内容の確認</div>
      <div id="preview-content"></div>
      <div class="btn-row">
        <button class="btn-primary" id="save-btn" onclick="doSave()">💾 保存する</button>
        <button class="btn-secondary" onclick="reset()">やり直す</button>
      </div>
    </div>
  </div>

  <!-- STEP3 -->
  <div id="pane-step3" style="display:none">
    <div class="card">
      <div class="save-complete">
        <div class="save-complete-icon">✅</div>
        <div class="save-complete-title">保存しました</div>
        <div class="save-complete-sub" id="save-complete-sub"></div>
      </div>
      <div class="btn-row" style="margin-top:16px;justify-content:center">
        <button class="btn-primary" onclick="location.href='report.html'">貢献実績表を開く</button>
        <button class="btn-secondary" onclick="reset()">別のPDFを取り込む</button>
      </div>
    </div>
  </div>
</div>

</body>
