<style>
:root{--bg:#F4F6F8;--white:#fff;--border:#E8EAED;--text:#333;--mid:#666;--light:#999;--primary:#2563EB}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100dvh}
.app{max-width:800px;margin:0 auto;padding:0 0 40px}
/* ===== トップバー ===== */
.top-bar{background:#fff;border-bottom:1px solid #E8EAED;padding:0;display:flex;align-items:stretch;position:sticky;top:0;z-index:100;min-height:52px}
.top-bar-logo{background:#fff;padding:8px 16px;display:flex;align-items:center;border-right:1px solid #E8EAED;flex-shrink:0}
.top-bar-logo img{height:34px;object-fit:contain}
.top-bar-main{padding:0 12px;display:flex;align-items:center;gap:8px;flex:1;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.top-bar-title{font-size:14px;font-weight:600;color:#333;white-space:nowrap}
.top-bar-divider{width:1px;height:22px;background:#E8EAED;flex-shrink:0}
.nav-link{padding:5px 10px;border-radius:6px;border:1px solid #E8EAED;background:#fff;color:#555;font-size:11px;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;text-decoration:none;display:inline-block;flex-shrink:0}
.nav-link:hover{background:#F4F6F8;border-color:#d0d3d8;color:#333}
.nav-link.active{background:#F0FAF6;border-color:#1D9E75;color:#1D9E75;font-weight:600}
.wrap{padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-box{background:#fff;border-radius:10px;border:1px solid var(--border);padding:11px 8px;text-align:center}
.stat-num{font-size:20px;font-weight:700}
.stat-label{font-size:10px;color:var(--light);margin-top:2px}
.filters{background:#fff;border-radius:10px;border:1px solid var(--border);padding:12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-select,.filter-input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;background:#fff}
.filter-input{flex:1;min-width:120px}
.btn-add{margin-left:auto;padding:7px 14px;background:#2563EB;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-add:hover{background:#1d4ed8}
/* cards */
.todo-card{background:#fff;border-radius:10px;border:1px solid var(--border);margin-bottom:8px;overflow:hidden;transition:box-shadow .15s;border-left:3px solid transparent}
.todo-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.todo-card.st-overdue{border-left-color:#DC2626}
.todo-card.st-urgent{border-left-color:#D97706}
.todo-card.st-soon{border-left-color:#CA8A04}
.todo-card.st-done-card{opacity:.6}
.todo-header{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.cat-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.todo-main{flex:1;min-width:0}
.todo-id-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.todo-id{font-size:10px;color:var(--light)}
.todo-title{font-size:13px;font-weight:600;line-height:1.4}
.todo-checkitem{font-size:11px;color:var(--mid);margin-top:2px}
.todo-meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.due-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700}
.due-overdue{background:#FEE2E2;color:#DC2626}
.due-urgent{background:#FEF3C7;color:#D97706}
.due-soon{background:#FEF9C3;color:#CA8A04}
.due-normal{background:#EFF6FF;color:#2563EB}
.s-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700}
.s-todo{background:#F4F6F8;color:#555}
.s-in_progress{background:#DBEAFE;color:#1D4ED8}
.s-done{background:#D1FAE5;color:#065F46}
.todo-arrow{font-size:11px;color:#bbb;flex-shrink:0;margin-top:3px;transition:transform .2s}
.todo-arrow.open{transform:rotate(180deg)}
/* body */
.todo-body{display:none;padding:0 14px 14px;border-top:1px solid #f0f0f0}
.todo-body.open{display:block}
.detail-box{font-size:12px;color:var(--mid);line-height:1.85;margin:12px 0;background:#F9FAFB;border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.due-label-row{font-size:11px;color:var(--mid);margin-bottom:8px}
.tags-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag-pill{font-size:10px;padding:2px 8px;border-radius:10px;background:#EFF6FF;color:#3B82F6;border:1px solid #BFDBFE;cursor:pointer;transition:background .15s}
.tag-pill:hover{background:#DBEAFE}
/* progress */
.prog-section{margin-top:10px}
.prog-heading{font-size:12px;font-weight:700;color:#333;margin-bottom:8px}
.prog-timeline{border-left:2px solid #E8EAED;padding-left:12px;margin-bottom:10px}
.prog-item{margin-bottom:10px}
.prog-meta{font-size:10px;color:var(--light);margin-bottom:2px}
.prog-comment{font-size:12px;line-height:1.7}
.prog-form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
textarea.prog-textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;resize:vertical;min-height:64px}
textarea.prog-textarea:focus{outline:none;border-color:#2563EB}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-prog{padding:7px 14px;background:#2563EB;color:#fff;border:none;border-radius:7px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.btn-prog:hover{background:#1d4ed8}
.btn-st{padding:7px 14px;border:1.5px solid;border-radius:7px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;background:#fff}
.btn-start{border-color:#2563EB;color:#2563EB}.btn-start:hover{background:#EFF6FF}
.btn-done{border-color:#059669;color:#059669}.btn-done:hover{background:#ECFDF5}
.btn-reopen{border-color:#D97706;color:#D97706}.btn-reopen:hover{background:#FFFBEB}
/* modal */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;margin-bottom:16px}
.fg{margin-bottom:13px}
.fg label{font-size:12px;font-weight:700;color:#444;display:block;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px}
.fg textarea{resize:vertical;min-height:80px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#2563EB}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-cancel{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:#fff;font-family:inherit;font-size:13px;cursor:pointer}
.btn-save{padding:8px 20px;background:#2563EB;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.empty{text-align:center;padding:40px 20px;color:var(--light);font-size:13px}
.loading{text-align:center;padding:40px;color:var(--light)}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:300;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
/* チェックボックスリスト */
.check-list{border:1.5px solid var(--border);border-radius:8px;max-height:150px;overflow-y:auto;padding:6px 10px;background:#fff}
.check-list label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:#333;padding:4px 0;cursor:pointer;margin:0}
.check-list input[type=checkbox]{width:15px;height:15px;flex-shrink:0;cursor:pointer}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<div class="top-bar">

</div><!-- /.app -->

</div>

  {id:"MGT-010",category:"経営者",sub_category:"存続・発展",check_item:"後継者問題への取り組み",title:"後継者育成：マネジャー向け経営視点学習機会の拡充・権限移譲の推進",detail:"経営理念・ビジョンを継承できる人材を育てるため、理念浸透の場を強化し、経営視点を学ぶ機会を増やす。管理職への権限移譲を段階的に推進する。",due_date:"2026-09-01",due_label:"2026年9月〜継続",frequency:"継続",tags:["後継者育成","権限移譲","組織開発"]},
];

// ── グローバル状態 ────────────────────────────────────────
let allTodos = [];    // Firestoreから取得した全件
let filtered = [];    // フィルタ後
let currentUser = null;
let userRole = '';
let userName = '';

let userData = null; // usersドキュメント（権限判定用）
const canWrite = () => can(userData, 'todo.edit');

// ── 期限判定 ─────────────────────────────────────────────
function dueStatus(due_date, status) {
  if (status === 'done') return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(due_date + 'T00:00:00'); // ローカル時刻として解釈（UTC解釈による1日ズレ防止）
  const diff = Math.round((due - today) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff <= 14) return 'urgent';
  if (diff <= 30) return 'soon';
  return 'normal';
}
function dueBadgeHtml(due_date, status) {
  const ds = dueStatus(due_date, status);
  if (!ds) return '';
  const d = new Date(due_date + 'T00:00:00');
  const label = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  const cls = ds === 'overdue' ? 'due-overdue' : ds === 'urgent' ? 'due-urgent' : ds === 'soon' ? 'due-soon' : 'due-normal';
  const prefix = ds === 'overdue' ? '期限超過 ' : ds === 'urgent' ? '⚠ ' : '';
  return `<span class="due-badge ${cls}">${prefix}${label}</span>`;
}

// ── カテゴリバッジ ────────────────────────────────────────
function catBadge(cat) {
  const s = CAT_STYLE[cat] || { bg:'#F4F6F8', color:'#666' };
  return `<span class="cat-badge" style="background:${s.bg};color:${s.color}">${cat}</span>`;
}

// ── ステータスバッジ ──────────────────────────────────────
function stBadge(st) {
  return `<span class="s-badge s-${st}">${STATUS_LABEL[st]||st}</span>`;
}

// ── 統計更新 ─────────────────────────────────────────────
function updateStats() {
  document.getElementById('st-total').textContent  = allTodos.length;
  document.getElementById('st-todo').textContent   = allTodos.filter(t=>t.status==='todo').length;
  document.getElementById('st-prog').textContent   = allTodos.filter(t=>t.status==='in_progress').length;
  document.getElementById('st-done').textContent   = allTodos.filter(t=>t.status==='done').length;
}

// ── フィルタ適用 ─────────────────────────────────────────
window.applyFilters = applyFilters;
function applyFilters() {
  const cat  = document.getElementById('f-cat').value;
  const st   = document.getElementById('f-st').value;
  const due  = document.getElementById('f-due').value;
  const dept = document.getElementById('f-dept').value;
  const name = document.getElementById('f-name').value;
  const kw   = document.getElementById('f-kw').value.toLowerCase();
  const now  = new Date(); now.setHours(0,0,0,0);
  const y    = now.getFullYear(), m = now.getMonth();
  filtered = allTodos.filter(t => {
    if (cat  && t.category   !== cat)  return false;
    if (st   && t.status     !== st)   return false;
    if (dept && t.department !== dept) return false;
    if (name && !todoPersonNames(t).includes(name)) return false;
    if (kw && ![t.title,t.check_item,t.category,t.sub_category,(t.tags||[]).join(',')].some(s=>s&&s.toLowerCase().includes(kw))) return false;
    if (due) {
      const dueDate = new Date(t.due_date);
      if (due === 'overdue')    return dueStatus(t.due_date, t.status) === 'overdue';
      if (due === 'this_month') return dueDate.getFullYear()===y && dueDate.getMonth()===m;
      if (due === 'next_month') { const nm=new Date(y,m+1,1); return dueDate.getFullYear()===nm.getFullYear()&&dueDate.getMonth()===nm.getMonth(); }
    }
    return true;
  });
  renderList();
}

// ── ToDoに紐づく担当者・メンバー名の一覧 ──────────────────
function todoPersonNames(t) {
  const names = [...(t.assignees||[]).map(a=>a.name), ...(t.members||[]).map(m=>m.name)];
  if (t.assigneeName) names.push(t.assigneeName);
  return names.filter(Boolean);
}

// ── 部署・担当者フィルタの選択肢をToDoデータから構築 ──────
function populateFilterOptions() {
  const deptSel = document.getElementById('f-dept');
  const nameSel = document.getElementById('f-name');
  const prevDept = deptSel.value, prevName = nameSel.value;

  const depts = [...new Set(allTodos.map(t=>t.department).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  const names = [...new Set(allTodos.flatMap(todoPersonNames))].sort((a,b)=>a.localeCompare(b,'ja'));

  deptSel.innerHTML = '<option value="">すべての部署</option>' + depts.map(d=>`<option value="${d}">${d}</option>`).join('');
  nameSel.innerHTML = '<option value="">すべての担当者</option>' + names.map(n=>`<option value="${n}">${n}</option>`).join('');

  if (depts.includes(prevDept)) deptSel.value = prevDept;
  if (names.includes(prevName)) nameSel.value = prevName;
}

// ── カードレンダリング ────────────────────────────────────
function renderList() {
  const el = document.getElementById('todo-list');
  if (!filtered.length) { el.innerHTML = '<div class="empty">該当するToDoはありません</div>'; return; }
  el.innerHTML = filtered.map(t => {
    const ds = dueStatus(t.due_date, t.status);
    const cardCls = t.status === 'done' ? 'st-done-card' : (ds ? `st-${ds}` : '');
    const logs = (t.progressLogs || []);
    const lastLog = logs.length ? logs[logs.length-1] : null;
    return `<div class="todo-card ${cardCls}" id="card-${t._docId}">
  <div class="todo-header" onclick="toggleCard('${t._docId}')">
    <div class="todo-main">
      <div class="todo-id-row">
        ${catBadge(t.category)}
        <span class="todo-id">${t.id || ''} · ${t.sub_category || ''}</span>
      </div>
      <div class="todo-title">${t.title}</div>
      <div class="todo-checkitem">${t.check_item || ''}</div>
      <div class="todo-meta">
        ${dueBadgeHtml(t.due_date, t.status)}
        ${stBadge(t.status)}
        ${t.department ? `<span style="font-size:10px;padding:2px 8px;border-radius:8px;background:#F0FAF6;color:#1D9E75;border:1px solid #A8D5BE;font-weight:700">${t.department}</span>` : ''}
        ${(()=>{const names=(t.assignees||[]).map(a=>a.name);if(!names.length&&t.assigneeName)names.push(t.assigneeName);return names.length?`<span style="font-size:10px;color:#666">👤 ${names.join('・')}</span>`:'';})()}
        <span style="font-size:10px;color:#bbb">${t.frequency||''}</span>
        ${lastLog ? `<span style="font-size:10px;color:#aaa">最終報告: ${lastLog.createdAt?.slice(0,10)||'—'}</span>` : ''}
      </div>
    </div>
    <div class="todo-arrow" id="arrow-${t._docId}">▼</div>
  </div>
  <div class="todo-body" id="body-${t._docId}">
    ${t.due_label ? `<div class="due-label-row" style="margin-top:10px">📅 ${t.due_label}</div>` : ''}
    ${(t.members||[]).length ? `<div class="due-label-row" style="margin-top:8px">👥 メンバー：${t.members.map(m=>m.name).join('・')}</div>` : ''}
    <div class="detail-box">${t.detail || '（詳細なし）'}</div>
    <div class="tags-row">${(t.tags||[]).map(g=>`<span class="tag-pill" onclick="filterByTag(event,'${g.replace(/'/g,"\\'")}')" title="このタグで絞り込む">${g}</span>`).join('')}</div>
    <div class="prog-section">
      <div class="prog-heading">進捗ログ</div>
      ${logs.length ? `<div class="prog-timeline">${logs.map(l=>`
        <div class="prog-item">
          <div class="prog-meta">${l.createdAt?.slice(0,10)||'—'} · ${l.createdByName||l.createdBy||'—'}</div>
          <div class="prog-comment">${l.comment}</div>
        </div>`).join('')}</div>` : '<div style="font-size:12px;color:#bbb;margin-bottom:10px">まだ進捗報告がありません</div>'}
      ${canWrite() ? `<div class="prog-form">
        <textarea class="prog-textarea" id="log-${t._docId}" placeholder="進捗・コメントを入力…"></textarea>
        <div class="btn-row">
          <button class="btn-prog" onclick="addLog('${t._docId}')">報告する</button>
          ${t.status === 'todo'        ? `<button class="btn-st btn-start" onclick="changeStatus('${t._docId}','in_progress')">着手する</button>` : ''}
          ${t.status !== 'done'        ? `<button class="btn-st btn-done"  onclick="changeStatus('${t._docId}','done')">完了にする</button>` : ''}
          ${t.status === 'done'        ? `<button class="btn-st btn-reopen" onclick="changeStatus('${t._docId}','todo')">再開する</button>` : ''}
          <button class="btn-st" style="border-color:#94A3B8;color:#64748B" onclick="openEditModal('${t._docId}')">✏️ 編集</button>
        </div>
      </div>` : ''}
    </div>
  </div>
</div>`;
  }).join('');
}

// ── タグクリックで絞り込み ────────────────────────────────
window.filterByTag = function(ev, tag) {
  ev.stopPropagation(); // カードの開閉を防ぐ
  const kw = document.getElementById('f-kw');
  if (kw.value === tag) { kw.value = ''; }   // 同じタグ再クリックで解除
  else { kw.value = tag; }
  applyFilters();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

// ── カード開閉 ───────────────────────────────────────────
window.toggleCard = function(docId) {
  const body  = document.getElementById('body-'+docId);
  const arrow = document.getElementById('arrow-'+docId);
  const open  = body.classList.contains('open');
  body.classList.toggle('open', !open);
  if (arrow) arrow.classList.toggle('open', !open);
};

// ── 進捗ログ追加 ─────────────────────────────────────────
window.addLog = async function(docId) {
  const ta = document.getElementById('log-'+docId);
  const comment = ta?.value.trim();
  if (!comment) { alert('コメントを入力してください'); return; }
  const t = allTodos.find(x=>x._docId===docId);
  if (!t) return;
  const newLog = { comment, createdAt: new Date().toISOString(), createdBy: currentUser.uid, createdByName: userName };
  const logs = [...(t.progressLogs||[]), newLog];
  await updateDoc(doc(db,'miraiTodos',docId), { progressLogs: logs, updatedAt: serverTimestamp() });
  t.progressLogs = logs;
  ta.value = '';
  showToast('報告を保存しました');
  renderList();
  // 展開を維持
  setTimeout(() => {
    document.getElementById('body-'+docId)?.classList.add('open');
    document.getElementById('arrow-'+docId)?.classList.add('open');
  }, 10);
};

// ── ステータス変更 ───────────────────────────────────────
window.changeStatus = async function(docId, newStatus) {
  const t = allTodos.find(x=>x._docId===docId);
  if (!t) return;
  const upd = { status: newStatus, updatedAt: serverTimestamp() };
  if (newStatus === 'done') upd.doneAt = serverTimestamp();
  await updateDoc(doc(db,'miraiTodos',docId), upd);
  t.status = newStatus;
  if (newStatus === 'done') t.doneAt = new Date().toISOString();
  updateStats();
  renderList();
  setTimeout(() => {
    document.getElementById('body-'+docId)?.classList.add('open');
    document.getElementById('arrow-'+docId)?.classList.add('open');
  }, 10);
};

// ── 部門・担当者・メンバーの選択肢 ────────────────────────
const FIXED_DEPTS = ['事業支援部','役員'];
// 担当者候補：一般ユーザー（user tier）以外の個人アカウント
let deptOptions = [];      // 部署一覧 + 固定項目
let assigneeOptions = [];  // {uid, name} 担当者候補
let memberOptions = [];    // {uid, name} メンバー候補（全有効ユーザー）

async function loadModalOptions() {
  try {
    const dSnap = await getDocs(collection(db,'departments'));
    const names = dSnap.docs.map(d=>d.data().name).filter(Boolean).sort();
    deptOptions = [...names, ...FIXED_DEPTS.filter(f=>!names.includes(f))];
  } catch(e) { console.error('departments:', e); deptOptions = [...FIXED_DEPTS]; }
  try {
    const uSnap = await getDocs(collection(db,'users'));
    const all = uSnap.docs
      .map(d=>({ uid:d.id, name:d.data().name||d.data().displayName||d.data().email||'', role:d.data().role, disabled:d.data().disabled }))
      .filter(u=>!u.disabled && u.name)
      .sort((a,b)=>a.name.localeCompare(b.name,'ja'));
    assigneeOptions = all.filter(u=>resolveTier(u).tier !== 'user');
    memberOptions = all;
  } catch(e) { console.error('users:', e); assigneeOptions = []; memberOptions = []; }
  const deptSel = document.getElementById('m-dept');
  deptSel.innerHTML = '<option value="">（未設定）</option>' + deptOptions.map(n=>`<option value="${n}">${n}</option>`).join('');
  document.getElementById('m-assignee-list').innerHTML = assigneeOptions.length
    ? assigneeOptions.map(u=>`<label><input type="checkbox" class="cb-assignee" value="${u.uid}" data-name="${u.name}">${u.name}</label>`).join('')
    : '<span style="font-size:12px;color:#999">候補がいません</span>';
  document.getElementById('m-members-list').innerHTML = memberOptions.length
    ? memberOptions.map(u=>`<label><input type="checkbox" class="cb-member" value="${u.uid}" data-name="${u.name}">${u.name}</label>`).join('')
    : '<span style="font-size:12px;color:#999">候補がいません</span>';
}

function setChecks(cls, uids) {
  document.querySelectorAll('.'+cls).forEach(cb => { cb.checked = uids.includes(cb.value); });
}
function getChecks(cls) {
  return [...document.querySelectorAll('.'+cls+':checked')].map(cb => ({ uid: cb.value, name: cb.dataset.name }));
}

// ── ToDo追加・編集モーダル ───────────────────────────────
let editingDocId = null; // null=新規追加、docId=編集

window.openAddModal = function() {
  editingDocId = null;
  document.getElementById('modal-title').textContent = 'ToDo 追加';
  document.getElementById('m-cat').value = '前提条件';
  document.getElementById('m-sub').value = '';
  document.getElementById('m-chk').value = '';
  document.getElementById('m-ttl').value = '';
  document.getElementById('m-det').value = '';
  const d = new Date();
  document.getElementById('m-due').value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('m-freq').value = '単発';
  document.getElementById('m-dept').value = '';
  setChecks('cb-assignee', []);
  setChecks('cb-member', []);
  document.getElementById('m-tags').value = '';
  document.getElementById('add-modal').classList.add('open');
};

window.openEditModal = function(docId) {
  const t = allTodos.find(x=>x._docId===docId);
  if (!t) return;
  editingDocId = docId;
  document.getElementById('modal-title').textContent = 'ToDo 編集';
  document.getElementById('m-cat').value = t.category || '前提条件';
  document.getElementById('m-sub').value = t.sub_category || '';
  document.getElementById('m-chk').value = t.check_item || '';
  document.getElementById('m-ttl').value = t.title || '';
  document.getElementById('m-det').value = t.detail || '';
  document.getElementById('m-due').value = t.due_date || '';
  document.getElementById('m-freq').value = t.frequency || '単発';
  // 部署が選択肢に無い過去データも表示できるよう一時追加
  const deptSel = document.getElementById('m-dept');
  if (t.department && ![...deptSel.options].some(o=>o.value===t.department)) {
    deptSel.insertAdjacentHTML('beforeend', `<option value="${t.department}">${t.department}</option>`);
  }
  deptSel.value = t.department || '';
  // 担当者：新形式(assignees配列)を優先、旧形式(assigneeUid)にもフォールバック
  const assigneeUids = (t.assignees||[]).map(a=>a.uid);
  if (!assigneeUids.length && t.assigneeUid) assigneeUids.push(t.assigneeUid);
  setChecks('cb-assignee', assigneeUids);
  setChecks('cb-member', (t.members||[]).map(m=>m.uid));
  document.getElementById('m-tags').value = (t.tags||[]).join(',');
  document.getElementById('add-modal').classList.add('open');
};

window.closeAddModal = function() {
  document.getElementById('add-modal').classList.remove('open');
  editingDocId = null;
};

window.saveNewTodo = async function() {
  const title = document.getElementById('m-ttl').value.trim();
  const due   = document.getElementById('m-due').value;
  if (!title || !due) { alert('タイトルと期限は必須です'); return; }
  const tags = document.getElementById('m-tags').value.split(/[,、]/).map(s=>s.trim()).filter(Boolean);
  const assignees = getChecks('cb-assignee');
  const members   = getChecks('cb-member');
  const fields = {
    category:    document.getElementById('m-cat').value,
    sub_category:document.getElementById('m-sub').value.trim(),
    check_item:  document.getElementById('m-chk').value.trim(),
    title,
    detail:      document.getElementById('m-det').value.trim(),
    due_date:    due,
    frequency:   document.getElementById('m-freq').value,
    department:  document.getElementById('m-dept').value,
    assignees,
    members,
    // 旧形式との互換（先頭の担当者を単一フィールドにも保持）
    assigneeUid:  assignees[0]?.uid || '',
    assigneeName: assignees[0]?.name || '',
    tags,
    updatedAt: serverTimestamp(),
  };
  try {
    if (editingDocId) {
      await updateDoc(doc(db,'miraiTodos',editingDocId), fields);
    } else {
      await addDoc(collection(db,'miraiTodos'), {
        ...fields,
        id: 'MNL-' + Date.now(),
        due_label: due,
        status: 'todo',
        source: 'manual',
        progressLogs: [],
        createdAt: serverTimestamp(),
        createdBy: currentUser.uid,
        createdByName: userName,
      });
    }
  } catch(e) {
    showToast('保存に失敗しました: ' + (e.code||e.message));
    return;
  }
  closeAddModal();
  await loadTodos();
  showToast('保存しました');
};

// ── データ読み込み ───────────────────────────────────────
async function loadTodos() {
  const el = document.getElementById('todo-list');
  try {
    const snap = await getDocs(query(collection(db,'miraiTodos'), orderBy('due_date','asc')));
    allTodos = snap.docs.map(d => ({ _docId: d.id, ...d.data() }));
    updateStats();
    populateFilterOptions();
    applyFilters();
  } catch(e) {
    console.error('loadTodos:', e);
    el.innerHTML = `<div class="empty" style="color:#DC2626">データの読み込みに失敗しました。<br><small style="color:#999">${e.code || e.message}</small></div>`;
  }
}

// ── 初期シード ───────────────────────────────────────────
async function seedIfEmpty() {
  try {
    const check = await getDocs(query(collection(db,'miraiTodos'), limit(1)));
    if (!check.empty) return;
    const BATCH_SIZE = 20;
    for (let i = 0; i < SEED_TASKS.length; i += BATCH_SIZE) {
      const batch = writeBatch(db);
      SEED_TASKS.slice(i, i+BATCH_SIZE).forEach(t => {
        batch.set(doc(collection(db,'miraiTodos')), {
          ...t, status:'todo', source:'initial', progressLogs:[],
          createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
        });
      });
      await batch.commit();
    }
  } catch(e) {
    console.error('seedIfEmpty:', e);
  }
}

// ── トースト ─────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── ログアウト ───────────────────────────────────────────
window.doLogout = () => signOut(auth).then(() => location.href='login.html');

// ── 初期化 ───────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (!user) { location.href='login.html'; return; }
  currentUser = user;
  try {
    const ud = await getDoc(doc(db,'users',user.uid));
    if (ud.exists()) { userData = ud.data(); userRole = userData.role || ''; userName = userData.name || userData.displayName || user.email; }
    else { userName = user.email; }
  } catch(e) {
    console.error('userDoc:', e);
    userName = user.email;
  }
  if (canWrite()) {
    document.getElementById('btn-add').style.display = 'block';
    await seedIfEmpty();
    await loadModalOptions();
  }
  await loadTodos();
});
</script>
