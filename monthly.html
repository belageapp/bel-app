<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon_192.png">
<link rel="apple-touch-icon" sizes="512x512" href="assets/favicon_512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貢献速報（月次） | ベルアージュ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:#F4F6F8;color:#333;font-size:12px}

/* サイドバー（PC）＋上部バー＋ツールバー構成 */
.sidebar{width:224px;flex-shrink:0;background:linear-gradient(180deg,#2FAF87,#239269);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .25s ease}
.sidebar::after{content:'';position:absolute;top:57px;right:-10px;bottom:0;width:10px;background:linear-gradient(to right,rgba(0,0,0,0.14),transparent);pointer-events:none}
.sb-logo{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#F4F6F8;border-bottom:1px solid rgba(0,0,0,0.06)}
.sb-logo img{height:28px;max-width:160px;object-fit:contain;display:block}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 0}
.sb-item{display:flex;align-items:center;gap:10px;padding:11px 18px;font-size:13px;color:rgba(255,255,255,0.85);text-decoration:none;border-left:4px solid transparent;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.sb-item .sb-ic{font-size:14px;width:18px;text-align:center;flex-shrink:0;opacity:.95}
.sb-item:hover{background:rgba(255,255,255,0.12);color:#fff}
.sb-item.active{background:rgba(255,255,255,0.2);color:#fff;border-left-color:#FFD54A;font-weight:600}
.sb-foot{border-top:1px solid rgba(255,255,255,0.18);padding:12px 16px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.sb-foot .logout-btn{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.9);font-size:11px;cursor:pointer;font-family:inherit;width:100%;transition:background .15s}
.sb-foot .logout-btn:hover{background:rgba(255,255,255,0.2)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:190;backdrop-filter:blur(1px)}
.sidebar-overlay.open{display:block}
.main{margin-left:224px;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#F4F6F8;border-bottom:3px solid #2FAF87;padding:0 22px;display:flex;align-items:center;gap:12px;height:57px;flex-shrink:0;position:sticky;top:0;z-index:100}
.topbar-title{font-size:15px;font-weight:700;color:#1D6E56;white-space:nowrap;letter-spacing:.3px}
.hamburger{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:#1D9E75;padding:4px 6px;line-height:1}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 22px;background:#fff;border-bottom:1px solid #E8EAED}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:block}
}

/* 月ナビ */
.month-nav{display:flex;align-items:center;gap:6px}
.nav-btn{
  width:28px;height:28px;border-radius:6px;
  border:1px solid #E8EAED;background:#fff;
  color:#555;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s;
}
.nav-btn:hover{background:#F4F6F8;border-color:#d0d3d8}
.month-label{font-size:14px;font-weight:600;color:#222;min-width:90px;text-align:center}

/* 凡例 */
.legend{display:flex;gap:12px;align-items:center;margin-left:auto;font-size:11px;color:#666}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:3px;border:1px solid #E8EAED}

/* ===== コンテンツエリア ===== */
.content{padding:14px 16px;overflow-x:auto}

/* ===== カレンダーテーブル ===== */
.cal-wrap{min-width:max-content;background:#fff;border-radius:10px;border:1px solid #E8EAED;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
table{border-collapse:collapse;font-size:11px;width:100%}
th,td{border-right:1px solid #E8EAED;border-bottom:1px solid #E8EAED;padding:0;text-align:center;white-space:nowrap}
th:last-child,td:last-child{border-right:none}

/* ===== テーブルヘッダー ===== */
.th-office{
  background:#F8F9FA;color:#444;font-weight:600;font-size:11px;
  padding:8px 12px;min-width:132px;text-align:left;
  position:sticky;left:0;z-index:10;
  border-right:2px solid #E8EAED;
}
.th-date{
  background:#F8F9FA;color:#555;font-weight:500;font-size:10px;
  min-width:40px;padding:4px 2px;vertical-align:bottom;
}
.th-date .d-num{font-size:13px;font-weight:700;display:block;line-height:1.3;color:#333}
.th-date .d-dow{font-size:9px;display:block;line-height:1.5;color:#888}
.th-date.sun .d-num{color:#C0392B}
.th-date.sun .d-dow{color:#C0392B}
.th-date.sat .d-num{color:#2471A3}
.th-date.sat .d-dow{color:#2471A3}
.th-date.today{background:#F0FAF6}
.th-date.today .d-num{color:#1D9E75}
.th-summary{
  background:#F8F9FA;color:#444;font-weight:600;font-size:10px;
  padding:4px 6px;min-width:58px;
  border-left:2px solid #E8EAED;
}

/* ===== カテゴリ行 ===== */
.tr-cat td{
  background:#F0FAF6;
  color:#1D9E75;font-weight:700;font-size:11px;
  padding:5px 12px;text-align:left;
  border-bottom:1px solid #d4f4e8;
}
.tr-cat td.td-spacer{background:#F0FAF6;border-color:#d4f4e8}
.tr-cat td.td-sticky{position:sticky;left:0;z-index:5;border-right:2px solid #d4f4e8}

/* ===== エリア行 ===== */
.tr-area td{
  background:#FAFBFC;
  color:#888;font-weight:500;font-size:10px;
  padding:3px 12px 3px 20px;text-align:left;
  border-bottom:1px solid #EEEFF1;
}
.tr-area td.td-spacer{background:#FAFBFC;border-color:#EEEFF1}
.tr-area td.td-sticky{position:sticky;left:0;z-index:5;border-right:2px solid #EEEFF1}

/* ===== 事業所名セル ===== */
.td-office{
  background:#fff;color:#333;font-weight:500;font-size:11px;
  padding:3px 10px 3px 16px;text-align:left;
  position:sticky;left:0;z-index:5;
  min-width:132px;border-right:2px solid #E8EAED;
}

/* ===== データセル ===== */
.td-data{padding:0;min-width:36px;line-height:1}
.cell-inner{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:2px 4px;min-height:18px}

/* 予約セル */
.td-goal{background:#F8FBFF}
.cell-goal{font-size:10px;color:#5B9BD5;font-weight:500}

/* 実績セル */
.td-actual{background:#FAFFFE}
.cell-actual{font-size:11px;font-weight:700;color:#1D9E75}
.cell-actual.under{color:#C0392B}
.cell-actual.none{color:#CCC;font-weight:400;font-size:9px}

/* 閉所セル */
.td-closed{background:#F8F9FA}
.cell-closed{font-size:9px;color:#CCC;letter-spacing:0}

/* 事業所名セル内のラベル */
.row-label{font-size:9px;font-weight:600;color:#aaa;margin-right:4px;min-width:20px;text-align:right}
.row-label.planned{color:#5B9BD5}
.row-label.actual{color:#1D9E75}

/* 土日カラム */
.col-sun .td-goal{background:#FDF8F8}
.col-sun .td-actual{background:#FDF8F8}
.col-sat .td-goal{background:#F8FAFD}
.col-sat .td-actual{background:#F8FAFD}
.col-today .td-goal{background:#F5FDF9}
.col-today .td-actual{background:#F5FDF9}

/* ===== 合計列 ===== */
.td-sum{
  border-left:2px solid #E8EAED;
  background:#F8F9FA;
  text-align:right;
  padding:2px 6px;
  font-size:11px;
  white-space:nowrap;
}
.td-sum.planned-sum{color:#5B9BD5;font-weight:600}
.td-sum.actual-sum{color:#1D9E75;font-weight:700}
.td-sum.actual-sum.under{color:#C0392B}
.td-sum.goal-sum{color:#888;font-weight:500;font-size:10px}
.td-sum.rate-sum{color:#555;font-size:10px}
.td-sum.days-sum{color:#888;font-size:10px}
.td-sum.avg-sum{color:#555;font-size:10px}

/* ===== エリア合計行 ===== */
.tr-area-sum td{background:#F0F8FF;border-bottom:2px solid #D6E8F8}
.tr-area-sum .td-office{background:#F0F8FF;color:#2471A3;font-weight:600;border-right:2px solid #D6E8F8}
.tr-area-sum .td-sum{background:#E8F4FF;border-left:2px solid #D6E8F8}

/* ===== 事業部合計行 ===== */
.tr-cat-sum td{background:#F0FAF6;border-bottom:2px solid #B2DFDB}
.tr-cat-sum .td-office{background:#F0FAF6;color:#1D9E75;font-weight:700;border-right:2px solid #B2DFDB}
.tr-cat-sum .td-sum{background:#E0F5ED;border-left:2px solid #B2DFDB}

/* ===== ローディング ===== */
.loading{text-align:center;padding:60px;color:#aaa;font-size:14px}
.tr-detail td{height:16px!important;padding:0 1px!important}
.tr-detail .cell-inner{min-height:14px}
</style>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, getDoc, getDocs, query, where, setDoc, addDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { can } from './perm.js';

const firebaseConfig = {
  apiKey:"AIzaSyCl48Fay9AbMLRXJ7npya4PJIgDQPvltxs",
  authDomain:"daily-report-b90e8.firebaseapp.com",
  projectId:"daily-report-b90e8",
  storageBucket:"daily-report-b90e8.firebasestorage.app",
  messagingSenderId:"16569831525",
  appId:"1:16569831525:web:aa250f2061f762dfe1768c"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ===== 認証チェック =====
const auth = getAuth(app);
const ROLE_LABELS = {
  admin:'Administrator', support:'事業支援課',
  area_manager:'エリアマネジャー', unit_manager:'ユニットマネジャー',
  manager:'事業所管理者'
};
let currentUserData = null;

onAuthStateChanged(auth, async user => {
  if (!user) { location.href = 'login.html'; return; }
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists() || snap.data().disabled) {
      await signOut(auth); location.href = 'login.html'; return;
    }
    currentUserData = snap.data();
    canEdit = can(currentUserData, 'monthly.edit');
    // ユーザー表示
    const el = document.getElementById('top-bar-user-info');
    if (el) {
      el.innerHTML = `<span style="font-size:10px;color:#fff;background:linear-gradient(135deg,#2FAF87,#0E9F6E);font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap">${ROLE_LABELS[currentUserData.role]||currentUserData.role}</span>
        <span style="font-size:11px;color:#888;white-space:nowrap">${user.email}</span>
        <span style="font-size:12px;color:#333;font-weight:500;white-space:nowrap">${currentUserData.displayName||''}</span>`;
    }
  } catch(e) { console.error(e); }
});

window._logout = async function() { await signOut(auth); location.href = 'login.html'; };

const OFFICES = [
  "HUGくみのいえ","ReadyGO井口","ReadyGO八木","ReadyGO川内","ここいろのいえ",
  "まなびあいのいえ","ReadyGO高屋","ReadyGO黒瀬","ぐらっちぇ黒瀬",
  "にじのいえ","はれのいえ",
  "ラフォーレ高陽","ラフォーレ亀山","レポ白木"
];
const LAFORE = ["ラフォーレ高陽","ラフォーレ亀山"];
const STRUCTURE = [
  { cat:"発達支援事業部", areas:[
    { label:"広島エリア",     offices:["HUGくみのいえ","ReadyGO井口","ReadyGO八木","ReadyGO川内","ここいろのいえ"] },
    { label:"東広島エリア",   offices:["まなびあいのいえ","ReadyGO高屋","ReadyGO黒瀬","ぐらっちぇ黒瀬"] },
    { label:"安芸エリア",     offices:["にじのいえ","はれのいえ"] }
  ]},
  { cat:"就労生活支援事業部", single:["ラフォーレ高陽","ラフォーレ亀山","レポ白木"] }
];

const DOW_JP = ['日','月','火','水','木','金','土'];
const now = new Date();
let viewYear  = now.getFullYear();
let viewMonth = now.getMonth() + 1; // 1-indexed

// -------- データキャッシュ --------
let capacities = {};   // office → capacity
let officePrices = {}; // office → 単価
let workdays   = {};   // office → { "YYYY-MM-DD": 0|1 }
let reports    = {};   // "YYYY-MM-DD" → { office → {kids, care, work} }
let dailyPlanned = {}; // office → { "YYYY-MM-DD": 予定人数 }
let detailMode   = false;
let canEdit      = false; // admin・supportのみtrue

// -------- セル手入力 --------
window.editCell = async function(type, office, dateStr, currentVal) {
  if (!canEdit) return;
  const val = prompt(
    `${office}　${dateStr}\n${type === 'planned' ? '予定人数' : '実績人数'}を入力`,
    currentVal ?? ''
  );
  if (val === null) return; // キャンセル
  const num = val === '' ? null : parseInt(val);
  if (val !== '' && (isNaN(num) || num < 0)) { alert('正しい数値を入力してください'); return; }

  const month = dateStr.slice(0, 7); // "YYYY-MM"
  const year  = parseInt(dateStr.slice(0, 4));
  const mon   = parseInt(dateStr.slice(5, 7));
  const fiscalYear = mon >= 4 ? year : year - 1;

  try {
    if (type === 'planned') {
      // dailyPlannedコレクションに保存
      const docId = `${year}_${mon}_${office}`;
      const ref   = doc(db, 'dailyPlanned', docId);
      const snap  = await getDoc(ref);
      const daily = snap.exists() ? snap.data().daily || {} : {};
      if (num === null) {
        delete daily[dateStr];
      } else {
        daily[dateStr] = num;
      }
      const total = Object.values(daily).reduce((s,v)=>s+v,0);
      await setDoc(ref, { year, month:mon, office, daily, total, updatedAt:new Date().toISOString() });
      // キャッシュ更新
      if (!dailyPlanned[office]) dailyPlanned[office] = {};
      if (num === null) delete dailyPlanned[office][dateStr];
      else dailyPlanned[office][dateStr] = num;

    } else {
      // reportsコレクションに保存（既存を上書き）
      const q = query(collection(db,'reports'),
        where('office','==',office),
        where('date','==',dateStr),
        where('source','==','manual')
      );
      const snap = await getDocs(q);
      // 既存のmanualデータを削除
      for (const d of snap.docs) await deleteDoc(d.ref);
      if (num !== null) {
        await addDoc(collection(db,'reports'), {
          office, date:dateStr, month,
          kids: num, serviceType: null,
          source: 'manual',
          time: new Date().toISOString(),
          comment: '',
        });
      }
      // キャッシュ更新
      if (!reports[dateStr]) reports[dateStr] = {};
      if (num === null) delete reports[dateStr][office];
      else reports[dateStr][office] = { kids: num };
    }
    // 再描画
    const fiscYear = mon >= 4 ? year : year - 1;
    render(fiscYear, year, mon, `${year}-${String(mon).padStart(2,'0')}`);
  } catch(e) {
    alert('保存に失敗しました: ' + e.message);
  }
};

// -------- 初期化 --------
async function init() {
  // offices + prices 一括取得
  const [offSnap, prSnap] = await Promise.all([
    getDocs(collection(db, 'offices')),
    getDocs(collection(db, 'prices'))
  ]);
  const prices = {};
  prSnap.forEach(d => prices[d.id] = d.data());
  offSnap.forEach(d => {
    const o = d.data();
    const p = prices[o.priceId];
    if (p && p.capacity) capacities[o.name] = p.capacity;
    officePrices[o.name] = o.price ?? p?.price ?? 0;
  });
  await loadMonth();
}

// -------- 月データ読み込み --------
async function loadMonth() {
  const monthStr = `${viewYear}-${String(viewMonth).padStart(2,'0')}`;
  document.getElementById('month-label').textContent =
    `${viewYear}年${viewMonth}月`;
  document.getElementById('cal-area').innerHTML =
    '<div class="loading">データを読み込み中...</div>';

  const fiscalYear = viewMonth >= 4 ? viewYear : viewYear - 1;

  // 全事業所の稼働日を並列取得
  workdays = {};
  await Promise.all(OFFICES.map(async o => {
    try {
      const snap = await getDoc(doc(db, 'workdays', `${fiscalYear}_${o}`));
      workdays[o] = snap.exists() ? (snap.data().days || {}) : {};
    } catch { workdays[o] = {}; }
  }));

  // 速報データ取得（reportsコレクション）
  reports = {};
  try {
    const q = query(collection(db, 'reports'), where('month', '==', monthStr));
    const snap = await getDocs(q);
    snap.forEach(d => {
      const r = d.data();
      const date = r.date;
      if (!reports[date]) reports[date] = {};
      if (!reports[date][r.office]) reports[date][r.office] = { kids: 0, care: null, work: null };
      const entry = reports[date][r.office];
      if (r.serviceType === 'care') { entry.care = r.kids; entry.kids += r.kids; }
      else if (r.serviceType === 'work') { entry.work = r.kids; entry.kids += r.kids; }
      else { entry.kids = r.kids; }
    });
  } catch (e) { console.error(e); }

  // 業務報告集計データ取得（dailyActualsコレクション）で補完
  try {
    await Promise.all(OFFICES.map(async o => {
      const docId = `${viewYear}_${viewMonth}_${o}`;
      const snap = await getDoc(doc(db, 'dailyActuals', docId));
      if (!snap.exists()) return;
      const daily = snap.data().daily || {};
      Object.entries(daily).forEach(([dateStr, kids]) => {
        if (kids <= 0) return;
        if (!reports[dateStr]) reports[dateStr] = {};
        if (!reports[dateStr][o]) {
          reports[dateStr][o] = { kids, care: null, work: null };
        }
      });
    }));
  } catch (e) { console.error(e); }

  // 予定人数取得（dailyPlannedコレクション）
  dailyPlanned = {};
  try {
    await Promise.all(OFFICES.map(async o => {
      const snap = await getDoc(doc(db, 'dailyPlanned', `${viewYear}_${viewMonth}_${o}`));
      if (!snap.exists()) return;
      dailyPlanned[o] = snap.data().daily || {};
    }));
  } catch (e) { console.error(e); }

  // reportsから問合せ・見学・契約・予定人数（速報入力）を取得
  try {
    const rSnap = await getDocs(query(collection(db,'reports'), where('month','==',monthStr)));
    rSnap.forEach(d => {
      const r = d.data();
      if (!r.date || !r.office || r.source === 'excel') return;
      if (!reports[r.date]) reports[r.date] = {};
      if (!reports[r.date][r.office]) reports[r.date][r.office] = {kids:r.kids||0};
      const e = reports[r.date][r.office];
      if (r.inquiry  != null) e.inquiry  = (e.inquiry  ||0)+(r.inquiry ||0);
      if (r.visit    != null) e.visit    = (e.visit    ||0)+(r.visit   ||0);
      if (r.contract != null) e.contract = (e.contract ||0)+(r.contract||0);
      // 速報入力の予定人数で上書き
      if (r.planned > 0) {
        if (!dailyPlanned[r.office]) dailyPlanned[r.office] = {};
        dailyPlanned[r.office][r.date] = r.planned;
      }
    });
  } catch (e) { console.error(e); }

  render(fiscalYear, viewYear, viewMonth, monthStr);
}

// -------- レンダリング --------
function render(fiscalYear, year, month, monthStr) {
  const daysInMonth = new Date(year, month, 0).getDate();
  const todayStr = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;

  // 日付リスト
  const dates = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(year, month-1, d).getDay();
    dates.push({ d, dateStr, dow });
  }

  // 予定・実績を事業所×日付で計算
  const planned  = {};
  const actuals  = {};
  const explicitPlanned = {}; // 定員フォールバックではなく、実際に予定人数が入力された日のみ値を持つ
  OFFICES.forEach(o => {
    planned[o]  = {};
    actuals[o]  = {};
    explicitPlanned[o] = {};
    const cap = capacities[o] || 10;
    const wd  = workdays[o] || {};
    dates.forEach(({ dateStr }) => {
      const isOpen = wd[dateStr] === 1;
      // 予定人数：dailyPlannedがあればその値、なければ定員（開所日のみ）
      const p = dailyPlanned[o]?.[dateStr];
      planned[o][dateStr]  = isOpen ? (p || cap) : null;
      explicitPlanned[o][dateStr] = isOpen && p ? p : null;
      actuals[o][dateStr]  = reports[dateStr]?.[o]?.kids ?? null;
    });
  });

  // HTML構築
  let html = '<div class="cal-wrap"><table>';

  // ===== ヘッダー行 =====
  html += '<thead><tr>';
  html += `<th class="th-office" style="min-width:120px">事業所</th>`;
  dates.forEach(({ d, dateStr, dow }) => {
    const isToday = dateStr === todayStr;
    const dowCls  = dow === 0 ? 'sun' : dow === 6 ? 'sat' : '';
    const todayCls = isToday ? ' today' : '';
    html += `<th class="th-date ${dowCls}${todayCls}">
      <span class="d-num">${d}</span>
      <span class="d-dow">${DOW_JP[dow]}</span>
    </th>`;
  });
  html += `<th class="th-summary" style="min-width:36px;font-size:9px">目標</th>
    <th class="th-summary" style="min-width:36px;font-size:9px">実績</th>
    <th class="th-summary" style="min-width:32px;font-size:9px">達成率</th>
    <th class="th-summary" style="min-width:32px;font-size:9px">平均</th>
    <th class="th-summary" style="min-width:36px;font-size:9px">予定</th>
    <th class="th-summary" style="min-width:28px;font-size:9px">キャン<br>セル</th>
    <th class="th-summary" style="min-width:44px;font-size:9px">キャンセル<br>概算</th>
    <th class="th-summary" style="min-width:28px;font-size:9px">稼働<br>予定</th>
    <th class="th-summary" style="min-width:28px;font-size:9px">稼働<br>実績</th>`;
  html += '</tr></thead>';

  // ===== ボディ =====
  html += '<tbody>';

  STRUCTURE.forEach(cat => {
    const catOffices = cat.areas
      ? cat.areas.flatMap(a => a.offices)
      : (cat.single || []);

    // カテゴリ行
    html += `<tr class="tr-cat">`;
    html += `<td class="td-sticky" style="position:sticky;left:0;z-index:5;border-right:2px solid #d4f4e8;background:#F0FAF6;color:#1D9E75;font-weight:700;font-size:11px;padding:5px 12px;text-align:left">${cat.cat}</td>`;
    dates.forEach(() => { html += `<td class="td-spacer"></td>`; });
    html += `<td class="td-spacer" style="border-left:2px solid #d4f4e8"></td></tr>`;

    // エリア or single
    if (cat.areas) {
      cat.areas.forEach(area => {
        // エリアラベル行
        html += `<tr class="tr-area">`;
        html += `<td class="td-sticky" style="position:sticky;left:0;z-index:5;border-right:2px solid #EEEFF1;background:#FAFBFC;color:#999;font-weight:500;font-size:10px;padding:3px 12px 3px 20px;text-align:left">▸ ${area.label}</td>`;
        dates.forEach(() => { html += `<td class="td-spacer"></td>`; });
        html += `<td class="td-spacer" style="border-left:2px solid #EEEFF1"></td></tr>`;

        // 各事業所
        area.offices.forEach(o => {
          html += officeRows(o, dates, planned, actuals, explicitPlanned, todayStr);
        });

        // エリア合計行
        html += areaSum(area.offices, dates, planned, actuals, explicitPlanned, area.label, todayStr);
      });
    } else {
      cat.single.forEach(o => {
        html += officeRows(o, dates, planned, actuals, explicitPlanned, todayStr);
      });
    }

    // 事業部合計行
    html += catSum(catOffices, dates, planned, actuals, explicitPlanned, cat.cat, todayStr);
  });

  html += '</tbody></table></div>';
  document.getElementById('cal-area').innerHTML = html;
}

// -------- 事業所行（予約・実績・詳細）--------
function officeRows(o, dates, goals, actuals, explicitPlanned, todayStr) {
  let html = '';
  const cap = capacities[o] || 10;
  const rowspan = detailMode ? 4 : 2;

  // 月計事前計算
  const monthGoal    = dates.reduce((s,{dateStr}) => s + (workdays[o]?.[dateStr]===1 ? cap : 0), 0);
  const monthPlanned = dates.reduce((s,{dateStr}) => {
    const g = goals[o][dateStr]; return s + (g !== null ? g : 0);
  }, 0);
  const monthActual  = dates.reduce((s,{dateStr}) => s + (actuals[o]?.[dateStr] ?? 0), 0);
  const achRate      = monthGoal > 0 ? Math.round(monthActual / monthGoal * 100) : null;
  const planDays     = dates.filter(({dateStr}) => workdays[o]?.[dateStr] === 1).length;
  const actDays      = dates.filter(({dateStr}) => {
    const v = actuals[o]?.[dateStr]; return v != null && v > 0;
  }).length;
  const avgActual    = actDays > 0 ? (monthActual / actDays).toFixed(1) : null;
  // キャンセル人数：予定人数が明示入力された日のみ（定員フォールバック日は対象外）
  const monthCancel  = dates.reduce((s,{dateStr}) => {
    const ep = explicitPlanned[o][dateStr];
    const av = actuals[o]?.[dateStr];
    if (ep == null || av == null) return s;
    return s + Math.max(0, ep - av);
  }, 0);
  const cancelEstimate = monthCancel * (officePrices[o] || 0);

  // === 予約行 ===
  html += `<tr>`;
  html += `<td class="td-office" rowspan="${rowspan}" style="vertical-align:middle">${o}</td>`;

  dates.forEach(({ dateStr, dow }) => {
    const g = goals[o][dateStr];
    const isSun = dow === 0, isSat = dow === 6;
    const isToday = dateStr === todayStr;
    const colBg = isToday ? '#F5FDF9' : isSun ? '#FDF8F8' : isSat ? '#F8FAFD' : '';

    if (g === null) {
      html += `<td class="td-data td-closed" rowspan="${rowspan}" style="${colBg?'background:'+colBg:'background:#F8F9FA'}">
        <div class="cell-inner" style="align-items:center"><span class="cell-closed">閉</span></div>
      </td>`;
      return;
    }
    html += `<td class="td-data td-goal" style="${colBg?'background:'+colBg:''}" ${canEdit?`onclick="editCell('planned','${o}','${dateStr}',${g})" style="${colBg?'background:'+colBg:''}cursor:pointer" title="クリックして編集"`:''}">
      <div class="cell-inner"><span class="cell-goal">${g}</span></div>
    </td>`;
  });

  // 月計：目標・実績・達成率・平均・予定・キャンセル人数・キャンセル概算・稼働予定日数・稼働実績日数（全てrowspanで縦結合）
  html += `<td class="td-sum goal-sum" rowspan="${rowspan}" style="vertical-align:middle">${monthGoal||'—'}</td>`;
  html += `<td class="td-sum actual-sum${monthActual < monthGoal && monthGoal>0 ? ' under' : ''}" rowspan="${rowspan}" style="vertical-align:middle">${monthActual||'—'}</td>`;
  html += `<td class="td-sum rate-sum" rowspan="${rowspan}" style="vertical-align:middle">${achRate !== null ? achRate+'%' : '—'}</td>`;
  html += `<td class="td-sum avg-sum" rowspan="${rowspan}" style="vertical-align:middle">${avgActual !== null ? avgActual : '—'}</td>`;
  html += `<td class="td-sum planned-sum" rowspan="${rowspan}" style="vertical-align:middle">${monthPlanned||'—'}</td>`;
  html += `<td class="td-sum cancel-sum" rowspan="${rowspan}" style="vertical-align:middle;${monthCancel>0?'color:#C0392B;font-weight:700':''}">${monthCancel>0 ? monthCancel : '—'}</td>`;
  html += `<td class="td-sum cancel-est-sum" rowspan="${rowspan}" style="vertical-align:middle;${cancelEstimate>0?'color:#C0392B;font-weight:700':''}">${cancelEstimate>0 ? '¥'+cancelEstimate.toLocaleString('ja-JP') : '—'}</td>`;
  html += `<td class="td-sum days-sum" rowspan="${rowspan}" style="vertical-align:middle">${planDays||'—'}</td>`;
  html += `<td class="td-sum days-sum" rowspan="${rowspan}" style="vertical-align:middle">${actDays||'—'}</td>`;
  html += `</tr>`;

  // === 実績行 ===
  html += `<tr>`;
  dates.forEach(({ dateStr, dow }) => {
    const g = goals[o][dateStr];
    if (g === null) return;
    const av = actuals[o][dateStr];
    const isSun = dow === 0, isSat = dow === 6;
    const isToday = dateStr === todayStr;
    const colBg = isToday ? '#F5FDF9' : isSun ? '#FDF8F8' : isSat ? '#F8FAFD' : '#FAFFFE';

    if (av !== null && av !== undefined) {
      const cls = av < cap ? 'under' : '';
      html += `<td class="td-data td-actual" style="background:${colBg}" ${canEdit?`onclick="editCell('actual','${o}','${dateStr}',${av})" style="background:${colBg};cursor:pointer" title="クリックして編集"`:''}">
        <div class="cell-inner"><span class="cell-actual ${cls}">${av}</span></div>
      </td>`;
    } else {
      const isPast = new Date(dateStr) < new Date(todayStr);
      html += `<td class="td-data td-actual" style="background:${colBg}" ${canEdit?`onclick="editCell('actual','${o}','${dateStr}',null)" style="background:${colBg};cursor:pointer" title="クリックして入力"`:''}">
        <div class="cell-inner"><span class="cell-actual none">${isPast ? '—' : ''}</span></div>
      </td>`;
    }
  });
  html += `</tr>`;

  // === 詳細モード ===
  if (detailMode) {
    let monthInquiry = 0, monthVisit = 0, monthContract = 0;
    html += `<tr class="tr-detail">`;
    dates.forEach(({ dateStr }) => {
      const g = goals[o][dateStr];
      if (g === null) return;
      const r = reports[dateStr]?.[o];
      const inq = r?.inquiry || 0;
      const vis = r?.visit   || 0;
      monthInquiry += inq; monthVisit += vis;
      html += `<td class="td-data" style="background:#FFFEF0;padding:1px">
        <div class="cell-inner" style="font-size:8px;line-height:1.4;align-items:flex-end">
          ${inq ? `<span style="color:#E67E22">問${inq}</span>` : ''}
          ${vis ? `<span style="color:#8E44AD">見${vis}</span>` : ''}
          ${!inq && !vis ? '<span style="color:#ddd">-</span>' : ''}
        </div>
      </td>`;
    });
    html += `<td class="td-sum" style="font-size:9px;color:#E67E22;text-align:right;padding:2px 4px">${monthInquiry||'—'}</td>`;
    html += `</tr>`;

    html += `<tr class="tr-detail">`;
    dates.forEach(({ dateStr }) => {
      const g = goals[o][dateStr];
      if (g === null) return;
      const r = reports[dateStr]?.[o];
      const con = r?.contract || 0;
      monthContract += con;
      html += `<td class="td-data" style="background:#F0FFF4;padding:1px">
        <div class="cell-inner" style="font-size:8px;align-items:flex-end">
          ${con ? `<span style="color:#1D9E75">契${con}</span>` : '<span style="color:#ddd">-</span>'}
        </div>
      </td>`;
    });
    html += `<td class="td-sum" style="font-size:9px;color:#1D9E75;text-align:right;padding:2px 4px">${monthContract||'—'}</td>`;
    html += `</tr>`;
  }

  return html;
}

// -------- エリア合計行 --------
function areaSum(offices, dates, goals, actuals, explicitPlanned, label, todayStr) {
  let html = `<tr class="tr-area-sum">`;
  html += `<td class="td-office" style="color:#2471A3;font-weight:600;padding-left:12px;border-right:2px solid #D6E8F8">▸ ${label}　合計</td>`;

  let mPlanned = 0, mActual = 0, hasActual = false;
  let mGoalCapacity = 0;
  offices.forEach(o => {
    const cap = capacities[o] || 10;
    dates.forEach(({ dateStr }) => { if (workdays[o]?.[dateStr] === 1) mGoalCapacity += cap; });
  });
  let mCancel = 0, mCancelEstimate = 0;
  dates.forEach(({ dateStr }) => {
    offices.forEach(o => {
      const ep = explicitPlanned[o][dateStr];
      const av = actuals[o]?.[dateStr];
      if (ep == null || av == null) return;
      const c = Math.max(0, ep - av);
      mCancel += c;
      mCancelEstimate += c * (officePrices[o] || 0);
    });
  });
  dates.forEach(({ dateStr, dow }) => {
    const dayPlanned = offices.reduce((s, o) => s + (goals[o][dateStr] ?? 0), 0);
    const dayActual = offices.reduce((s, o) => s + (actuals[o][dateStr] ?? 0), 0);
    const anyOpen   = offices.some(o => goals[o][dateStr] !== null);
    const anyActual = offices.some(o => actuals[o][dateStr] !== null);
    const isToday = dateStr === todayStr;
    const isSun = dow === 0, isSat = dow === 6;
    const colBg = isToday ? '#E8F8F2' : isSun ? '#F5ECEC' : isSat ? '#EEF2F8' : '';

    if (!anyOpen) {
      html += `<td style="background:#F0F0F2;border-right:1px solid #E8EAED"><div class="cell-inner"><span style="font-size:9px;color:#CCC">閉</span></div></td>`;
      return;
    }
    mPlanned += dayPlanned;
    if (anyActual) { mActual += dayActual; hasActual = true; }
    const pctCls = anyActual && dayPlanned > 0 && dayActual < dayPlanned ? 'color:#C0392B' : 'color:#1D6E3E';
    html += `<td style="${colBg?'background:'+colBg+';':''}border-right:1px solid #E8EAED;text-align:right;padding:1px 4px">
      <span style="font-size:10px;color:#5B9BD5;font-weight:500;display:block">${dayPlanned}</span>
      <span style="font-size:11px;font-weight:700;display:block;${anyActual?pctCls:'color:#CCC'}">${anyActual ? dayActual : '—'}</span>
    </td>`;
  });

  const areRate = mGoalCapacity > 0 && hasActual ? Math.round(mActual/mGoalCapacity*100)+'%' : '—';
  const s = 'background:#E8F4FF;text-align:right;padding:2px 6px;font-size:10px;border-left:1px solid #D6E8F8';
  html += `<td class="td-sum" style="${s};border-left:2px solid #D6E8F8;font-weight:600;color:#2471A3">${mGoalCapacity||'—'}</td>`;
  html += `<td class="td-sum" style="${s};font-weight:700;color:${hasActual && mActual < mGoalCapacity ? '#C0392B' : '#1D6E3E'}">${hasActual ? mActual : '—'}</td>`;
  html += `<td class="td-sum" style="${s};color:#888">${areRate}</td>`;
  html += `<td class="td-sum" style="${s};color:#555">—</td>`;
  html += `<td class="td-sum" style="${s};color:#5B9BD5;font-weight:600">${mPlanned||'—'}</td>`;
  html += `<td class="td-sum" style="${s};${mCancel>0?'color:#C0392B;font-weight:700':'color:#888'}">${mCancel>0 ? mCancel : '—'}</td>`;
  html += `<td class="td-sum" style="${s};${mCancelEstimate>0?'color:#C0392B;font-weight:700':'color:#888'}">${mCancelEstimate>0 ? '¥'+mCancelEstimate.toLocaleString('ja-JP') : '—'}</td>`;
  html += `<td class="td-sum" style="${s};color:#888">—</td>`;
  html += `<td class="td-sum" style="${s};color:#888">—</td>`;
  html += `</tr>`;
  return html;
}

// -------- 事業部合計行 --------
function catSum(offices, dates, goals, actuals, explicitPlanned, label, todayStr) {
  let html = `<tr class="tr-cat-sum">`;
  html += `<td class="td-office" style="color:#1D9E75;font-weight:700;border-right:2px solid #B2DFDB">${label}　計</td>`;

  let mPlanned = 0, mActual = 0, hasActual = false;
  let mGoalCapacity = 0;
  offices.forEach(o => {
    const cap = capacities[o] || 10;
    dates.forEach(({ dateStr }) => { if (workdays[o]?.[dateStr] === 1) mGoalCapacity += cap; });
  });
  let mCancel = 0, mCancelEstimate = 0;
  dates.forEach(({ dateStr }) => {
    offices.forEach(o => {
      const ep = explicitPlanned[o][dateStr];
      const av = actuals[o]?.[dateStr];
      if (ep == null || av == null) return;
      const c = Math.max(0, ep - av);
      mCancel += c;
      mCancelEstimate += c * (officePrices[o] || 0);
    });
  });
  dates.forEach(({ dateStr, dow }) => {
    const dayPlanned = offices.reduce((s, o) => s + (goals[o][dateStr] ?? 0), 0);
    const dayActual = offices.reduce((s, o) => s + (actuals[o][dateStr] ?? 0), 0);
    const anyOpen   = offices.some(o => goals[o][dateStr] !== null);
    const anyActual = offices.some(o => actuals[o][dateStr] !== null);
    const isToday = dateStr === todayStr;
    const isSun = dow === 0, isSat = dow === 6;
    const colBg = isToday ? '#E0F5EC' : isSun ? '#EFF6F0' : isSat ? '#EFF3F6' : '';

    if (!anyOpen) {
      html += `<td style="background:#F2F5F2;border-right:1px solid #d4f4e8"></td>`;
      return;
    }
    mPlanned += dayPlanned;
    if (anyActual) { mActual += dayActual; hasActual = true; }
    const pctCls = anyActual && dayPlanned > 0 && dayActual < dayPlanned ? 'color:#C0392B' : 'color:#0F6E56';
    html += `<td style="${colBg?'background:'+colBg+';':''}border-right:1px solid #d4f4e8;text-align:right;padding:1px 4px">
      <span style="font-size:10px;color:#1D9E75;font-weight:500;display:block">${dayPlanned}</span>
      <span style="font-size:11px;font-weight:700;display:block;${anyActual?pctCls:'color:#CCC'}">${anyActual ? dayActual : '—'}</span>
    </td>`;
  });

  const catRate = mGoalCapacity > 0 && hasActual ? Math.round(mActual/mGoalCapacity*100)+'%' : '—';
  const s2 = 'background:#E0F5ED;text-align:right;padding:2px 6px;font-size:10px;border-left:1px solid #B2DFDB';
  html += `<td class="td-sum" style="${s2};border-left:2px solid #B2DFDB;font-weight:600;color:#1D9E75">${mGoalCapacity||'—'}</td>`;
  html += `<td class="td-sum" style="${s2};font-weight:700;color:${hasActual && mActual < mGoalCapacity ? '#C0392B' : '#0F6E56'}">${hasActual ? mActual : '—'}</td>`;
  html += `<td class="td-sum" style="${s2};color:#888">${catRate}</td>`;
  html += `<td class="td-sum" style="${s2};color:#555">—</td>`;
  html += `<td class="td-sum" style="${s2};color:#1D9E75;font-weight:600">${mPlanned||'—'}</td>`;
  html += `<td class="td-sum" style="${s2};${mCancel>0?'color:#C0392B;font-weight:700':'color:#888'}">${mCancel>0 ? mCancel : '—'}</td>`;
  html += `<td class="td-sum" style="${s2};${mCancelEstimate>0?'color:#C0392B;font-weight:700':'color:#888'}">${mCancelEstimate>0 ? '¥'+mCancelEstimate.toLocaleString('ja-JP') : '—'}</td>`;
  html += `<td class="td-sum" style="${s2};color:#888">—</td>`;
  html += `<td class="td-sum" style="${s2};color:#888">—</td>`;
  html += `</tr>`;
  return html;
}

// -------- 月移動 --------
window.toggleDetail = function() {
  detailMode = !detailMode;
  const btn = document.getElementById('detail-btn');
  btn.style.background    = detailMode ? '#F0FAF6' : '#fff';
  btn.style.color         = detailMode ? '#1D9E75' : '#555';
  btn.style.borderColor   = detailMode ? '#1D9E75' : '#E8EAED';
  btn.textContent         = detailMode ? '詳細非表示' : '詳細表示';
  loadMonth(viewYear, viewMonth);
};

window.shiftMonth = function(dir) {
  viewMonth += dir;
  if (viewMonth > 12) { viewMonth = 1;  viewYear++; }
  if (viewMonth < 1)  { viewMonth = 12; viewYear--; }
  loadMonth();
};

// 起動
init();
